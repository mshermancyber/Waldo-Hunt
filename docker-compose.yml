version: "3.9"

services:
  waldohunt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waldohunt
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      # Optional: mount html directory for live editing without rebuild
      # Uncomment the line below for development mode
      # - ./html:/var/www/waldohunt:ro
      - nginx_logs:/var/log/nginx
    environment:
      - TZ=America/New_York
    networks:
      - waldohunt_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.waldohunt.description=Insider Threat SPL Generator"
      - "com.waldohunt.version=beta1"

networks:
  waldohunt_net:
    driver: bridge

volumes:
  nginx_logs:
    driver: local
